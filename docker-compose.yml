services:
  windows-10:
    image: dockurr/windows:latest
    container_name: moon-windows-10
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "Administrator"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3390:3389/tcp"
      - "3390:3389/udp"
    volumes:
      - ./data/dockur/windows-10:/storage
    restart: unless-stopped
    stop_grace_period: 2m

  windows-7:
    image: dockurr/windows:latest
    container_name: moon-windows-7
    environment:
      VERSION: "7u"
      RAM_SIZE: "2G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "Administrator"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8007:8006"
      - "3391:3389/tcp"
      - "3391:3389/udp"
    volumes:
      - ./data/dockur/windows-7:/storage
    restart: unless-stopped
    stop_grace_period: 2m
