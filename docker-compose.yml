services:
  moon-cloud:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        DOWNLOAD_WIN10: "false"
        DOWNLOAD_WIN7: "false"
    container_name: moon-cloud-windows
    environment:
      PORT: "3000"
      KVM: "N"
      ACCEL: "tcg"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  iso-downloader:
    build:
      context: .
      dockerfile: Dockerfile
      target: iso-downloader
    container_name: moon-iso-downloader
    profiles:
      - iso
    volumes:
      - ./data/iso:/app/data/iso
    entrypoint: ["/usr/local/bin/download-windows-iso.sh"]

  windows-10:
    image: dockurr/windows:latest
    container_name: moon-windows-10
    environment:
      VERSION: "10"
      KVM: "N"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "Administrator"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3390:3389/tcp"
      - "3390:3389/udp"
    volumes:
      - ./data/dockur/windows-10:/storage
    restart: unless-stopped
    stop_grace_period: 2m

  windows-7:
    image: dockurr/windows:latest
    container_name: moon-windows-7
    environment:
      VERSION: "7u"
      KVM: "N"
      RAM_SIZE: "2G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "Administrator"
    cap_add:
      - NET_ADMIN
    ports:
      - "8007:8006"
      - "3391:3389/tcp"
      - "3391:3389/udp"
    volumes:
      - ./data/dockur/windows-7:/storage
    restart: unless-stopped
    stop_grace_period: 2m
